<!DOCTYPE html>
<html lang="en">
    <head> 
        <title> Lists </title>
    </head>
    <body>
        <h3>An Ordered list: </h3>
        <ol>
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>

        </ol>
        <h3>An Unordered list: </h3>
        <ul>
            <li>First Item</li>
            <li>Third Item</li>
            <li>Second Item</li>
        </ul>
    </body>
</html>
